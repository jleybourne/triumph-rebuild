[workspace]
resolver = "2"
members = ["crates/uma", "crates/cardlock", "crates/xlist", "crates/sir", "crates/config", "crates/loader", "crates/input", "crates/vfs", "crates/runtime", "crates/upscale", "crates/dstorage", "crates/xg", "crates/shader", "crates/audio", "crates/winfiles", "crates/gdk", "crates/pipelines", "crates/d3d12x", "crates/ffx", "apps/launcher", "apps/rebuild"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
# function names and lines in the PDB for crash reports (no effect on generated code)
debug = "line-tables-only"
