[workspace]
resolver = "2"
members = ["crates/uma", "crates/xlist", "crates/sir", "crates/config", "crates/loader", "crates/input", "crates/vfs", "crates/runtime", "crates/upscale", "apps/rebuild", "apps/launcher"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
