[package]
name = "rebuild"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rebuild-uma = { path = "../../crates/uma" }
rebuild-xlist = { path = "../../crates/xlist" }
rebuild-loader = { path = "../../crates/loader" }
rebuild-sir = { path = "../../crates/sir" }
rebuild-runtime = { path = "../../crates/runtime" }
rebuild-upscale = { path = "../../crates/upscale" }
rebuild-shader = { path = "../../crates/shader" }
rebuild-winfiles = { path = "../../crates/winfiles" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_IO"] }
