version.workspace = true

[dependencies]
rebuild-uma = { path = "../../crates/uma" }
rebuild-xlist = { path = "../../crates/xlist" }
rebuild-loader = { path = "../../crates/loader" }
rebuild-sir = { path = "../../crates/sir" }
