[package]
name = "rebuild-launcher"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

# The desktop launcher (docs/design/launcher.md). egui/eframe: no browser engine, no network crate.

[lib]
name = "rebuild_launcher"
path = "src/lib.rs"

[[bin]]
name = "rebuild-launcher"
path = "src/main.rs"

# A stand-in for rebuild.exe, used only by the launch tests (tests/launch.rs). It takes no GPU.
[[bin]]
name = "fake-layer"
path = "src/bin/fake-layer.rs"

[dependencies]
rebuild-config = { path = "../../crates/config" }
rebuild-vfs = { path = "../../crates/vfs" }
rebuild-saves = { path = "../../crates/saves" }
rebuild-gdk = { path = "../../crates/gdk" }
rebuild-storage = { path = "../../crates/storage" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
egui-phosphor = { version = "0.9", features = ["regular"] }
png = "0.17"
toml = "0.8"

[dev-dependencies]
ttf-parser = "0.25"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
