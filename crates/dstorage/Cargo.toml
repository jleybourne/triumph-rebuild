[package]
name = "rebuild-dstorage"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rebuild-storage = { path = "../storage" }
rebuild-vfs = { path = "../vfs" }
# Zlib licence; pure Rust, no C toolchain.
zlib-rs = "0.6.9"
# BCPack cache keys (CC0 / Apache-2.0) and entry checks (MIT / Apache-2.0).
blake3 = "1.8.7"
crc32fast = "1.5.6"

[[bin]]
name = "dsbench"
path = "src/bin/dsbench.rs"

[[bin]]
name = "bcbench"
path = "src/bin/bcbench.rs"
