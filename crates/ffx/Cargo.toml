[package]
name = "rebuild-ffx"
description = "Our implementation of the FidelityFX API the title imports (amd_fidelityfx_loader_xbox.dll): its upscale goes to rebuild-upscale."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rebuild-upscale = { path = "../upscale" }

[target.'cfg(windows)'.dependencies]
rebuild-d3d12x = { path = "../d3d12x" }
rebuild-xlist = { path = "../xlist" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
rebuild-pipelines = { path = "../pipelines" }
