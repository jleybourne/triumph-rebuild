[package]
name = "rebuild-runtime"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rebuild-loader = { path = "../loader" }
rebuild-vfs = { path = "../vfs" }
rebuild-winfiles = { path = "../winfiles" }
rebuild-audio = { path = "../audio" }
rebuild-dstorage = { path = "../dstorage" }
rebuild-xg = { path = "../xg" }
rebuild-gdk = { path = "../gdk" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_JobObjects"] }
