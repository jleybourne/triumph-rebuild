[package]
name = "rebuild-runtime"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rebuild-loader = { path = "../loader" }
rebuild-vfs = { path = "../vfs" }
rebuild-winfiles = { path = "../winfiles" }
rebuild-audio = { path = "../audio" }
rebuild-dstorage = { path = "../dstorage" }
rebuild-xg = { path = "../xg" }
rebuild-gdk = { path = "../gdk" }
rebuild-d3d12x = { path = "../d3d12x" }
rebuild-uma = { path = "../uma" }
rebuild-xlist = { path = "../xlist" }
rebuild-pipelines = { path = "../pipelines" }
rebuild-shader = { path = "../shader" }
rebuild-ffx = { path = "../ffx" }
rebuild-overlay = { path = "../overlay" }
rebuild-input = { path = "../input" }
rebuild-config = { path = "../config" }
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Graphics_Direct3D_Fxc", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
