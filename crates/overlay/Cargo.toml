[package]
name = "rebuild-overlay"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rebuild-config = { path = "../config" }
rebuild-input = { path = "../input" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
rebuild-cardlock = { path = "../cardlock" }
png = "0.17"
